<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Neon Garage Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:#070A12;
  color:#EAF2FF;
}

/* HERO */
.hero{
  text-align:center;
  padding:120px 20px 50px;
  background: radial-gradient(circle at top, #101A33, #070A12);
}

.hero h1{
  font-size:64px;
  letter-spacing:10px;
  color:#4DA3FF;
  text-shadow:0 0 30px rgba(77,163,255,0.45);
}

.hero p{
  color:#93a7c6;
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

/* CARD */
.card{
  background:#0C1222;
  border:1px solid rgba(77,163,255,0.2);
  border-radius:16px;
  padding:20px;
  transition:0.25s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #223456;
  background:#070A12;
  color:#fff;
}

/* PREVIEW */
.preview{
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background: radial-gradient(circle, #0a0f1d, #05070f);
  border:1px solid rgba(77,163,255,0.2);
  font-size:44px;
  font-weight:700;
  letter-spacing:2px;
  text-shadow:0 0 20px rgba(255,255,255,0.15);
}

/* BUTTON */
.btn{
  padding:12px;
  border:1px solid #4DA3FF;
  color:#4DA3FF;
  background:none;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
  letter-spacing:0.5px;
}

.btn:hover{
  background:#4DA3FF;
  color:#070A12;
  box-shadow:0 0 25px rgba(77,163,255,0.4);
}

/* GALLERY */
.gallery{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #1b2a47;
}
</style>
</head>

<body>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Neon Garage Custom Vinyl • Built for Car Culture</p>
</div>

<div class="container">

<div class="grid">

<!-- BUILDER -->
<div class="card">

<form action="https://formspree.io/f/xzdydgap" method="POST">

<!-- TEXT INPUT -->
<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<!-- FONT SELECTOR -->
<label>Font Style</label>
<select id="fontSelect" name="font">
<option value="Inter">Default Clean</option>
<option value="Impact">Racing Block</option>
<option value="Arial Black">Street Bold</option>
<option value="cursive">Script Flow</option>
<option value="monospace">JDM Tech</option>
<option value="Tahoma">OEM Clean</option>
<option value="Verdana">Modern Clean</option>
<option value="Georgia">Classic</option>
<option value="Courier New">Typewriter</option>
<option value="Trebuchet MS">Sport Style</option>
</select>

<!-- COLORS -->
<label>Primary Color</label>
<select id="color" name="color">
<option value="white">White</option>
<option value="red">Red</option>
<option value="orange">Orange</option>
<option value="yellow">Yellow</option>
<option value="green">Green</option>
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="pink">Pink</option>
<option value="silver">Chrome</option>
</select>

<label>Layer (+$5)</label>
<select name="layer">
<option>No</option>
<option>Yes</option>
</select>

<!-- NOTES -->
<textarea name="notes" placeholder="Notes (placement, sizing, custom requests)"></textarea>

<button class="btn" type="submit">Submit Order</button>

</form>

</div>

<!-- PREVIEW -->
<div class="card">

<div class="preview" id="preview">
YOUR DESIGN
</div>

</div>

</div>

<!-- GALLERY -->
<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>

</div>

<script>

const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const color = document.getElementById("color");
const preview = document.getElementById("preview");

function update(){
  preview.innerText = textInput.value || "YOUR DESIGN";
  preview.style.color = color.value;
  preview.style.fontFamily = fontSelect.value;
}

textInput.addEventListener("input", update);
fontSelect.addEventListener("change", update);
color.addEventListener("change", update);

</script>

</body>
</html>
