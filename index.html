<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Elite Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:#02040a;
  color:#eaf2ff;
}

/* HERO */
.hero{
  text-align:center;
  padding:110px 20px 40px;
  background:radial-gradient(circle at top,#0a152a,#02040a);
}

.hero h1{
  font-size:64px;
  letter-spacing:10px;
  color:#5aa7ff;
  text-shadow:0 0 25px rgba(90,167,255,0.5);
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

/* CARD */
.card{
  background:#050b18;
  border:1px solid #13233f;
  border-radius:16px;
  padding:20px;
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #223456;
  background:#02040a;
  color:#fff;
}

/* PREVIEW */
.preview{
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:linear-gradient(145deg,#000,#0a0f1d);
  border:1px solid #223456;
  font-size:44px;
  font-weight:700;
  text-shadow:0 0 20px rgba(255,255,255,0.2);
  transition:0.2s;
}

/* SUMMARY */
.summary{
  font-size:13px;
  color:#93a7c6;
  margin-top:10px;
}

/* BUTTON */
.btn{
  padding:12px;
  border:1px solid #5aa7ff;
  color:#5aa7ff;
  background:none;
  border-radius:10px;
  cursor:pointer;
}

.btn:hover{
  background:#5aa7ff;
  color:#02040a;
}

/* UPLOAD */
input[type="file"]{
  padding:10px;
}

/* GALLERY */
.gallery{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #1b2a47;
}
</style>
</head>

<body>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Final Boss Builder • Car Scene Ready • Pro Grade Workflow</p>
</div>

<div class="container">

<div class="grid">

<!-- BUILDER -->
<div class="card">

<form action="https://formspree.io/f/xzdydgap" method="POST" enctype="multipart/form-data">

<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<label>Font Style</label>
<select id="fontSelect" name="font">
<option value="Inter">Default Clean</option>
<option value="Impact">Racing Block</option>
<option value="cursive">Script</option>
<option value="monospace">Tech/JDM</option>
<option value="Arial Black">Bold Street</option>
</select>

<label>Primary Color</label>
<select id="color" name="color">
<option value="white">White</option>
<option value="red">Red</option>
<option value="orange">Orange</option>
<option value="yellow">Yellow</option>
<option value="green">Green</option>
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="pink">Pink</option>
<option value="silver">Chrome</option>
</select>

<label>Upload Reference Image</label>
<input type="file" name="image">

<label>Notes</label>
<textarea name="notes" placeholder="Placement, sizing, custom requests"></textarea>

<button class="btn" type="submit">Submit Order</button>

</form>

<div class="summary" id="summary"></div>

</div>

<!-- PREVIEW -->
<div class="card">

<div class="preview" id="preview">
YOUR DESIGN
</div>

<div class="summary" id="liveSummary">
Live preview updates here
</div>

</div>

</div>

<!-- GALLERY -->
<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>

</div>

<script>

const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const color = document.getElementById("color");
const preview = document.getElementById("preview");
const liveSummary = document.getElementById("liveSummary");

function update(){

  preview.innerText = textInput.value || "YOUR DESIGN";
  preview.style.color = color.value;
  preview.style.fontFamily = fontSelect.value;

  liveSummary.innerHTML =
    "Text: " + (textInput.value || "-") + "<br>" +
    "Font: " + fontSelect.value + "<br>" +
    "Color: " + color.value;
}

textInput.addEventListener("input", update);
fontSelect.addEventListener("change", update);
color.addEventListener("change", update);

</script>

</body>
</html>
