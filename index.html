<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:#020409;
  color:#eaf2ff;
}

/* HERO */
.hero{
  text-align:center;
  padding:120px 20px 60px;
  background:radial-gradient(circle at top,#0a1426,#020409);
}

.hero h1{
  font-size:64px;
  letter-spacing:10px;
  color:#5aa7ff;
  text-shadow:0 0 25px rgba(90,167,255,0.4);
}

.hero p{
  color:#8fa6c9;
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

/* CARD */
.card{
  background:#050b17;
  border:1px solid #13203a;
  border-radius:16px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
}

/* INPUT */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #1f2f55;
  background:#020409;
  color:white;
}

/* PREVIEW */
.preview{
  height:220px;
  background:linear-gradient(#000,#111);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  border:1px solid #1f2f55;
  font-size:42px;
  font-weight:700;
  letter-spacing:2px;
  text-shadow:0 0 10px rgba(255,255,255,0.3);
}

/* BUTTON */
.btn{
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  border:1px solid #5aa7ff;
  color:#5aa7ff;
  background:none;
  cursor:pointer;
}

.btn:hover{
  background:#5aa7ff;
  color:#020409;
}

.summary{
  margin-top:10px;
  font-size:14px;
  color:#9fb3d6;
}
</style>
</head>

<body>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Built for clean installs • Car scene approved</p>
</div>

<div class="container">

<div class="grid">

<!-- BUILDER -->
<div class="card">

<form action="https://formspree.io/f/xzdydgap" method="POST">

<input id="ig" name="instagram_name" placeholder="Instagram Name (@yourname)" required>
<input name="zelle_name" placeholder="Zelle Name" required>

<input id="textInput" name="text" placeholder="Enter decal text" required>

<label>Font (from dafont.com)</label>
<input id="fontInput" name="font" placeholder="Type font name">

<label>Primary Color</label>
<select id="color" name="primary_color">
<option value="white">White</option>
<option value="red">Red</option>
<option value="orange">Orange</option>
<option value="yellow">Yellow</option>
<option value="green">Green</option>
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="pink">Pink</option>
<option value="silver">Chrome</option>
</select>

<label>Layer (+$5)</label>
<select id="layer" name="layer">
<option>No</option>
<option>Yes</option>
</select>

<textarea name="notes" placeholder="Notes (placement, size, custom requests)"></textarea>

<button class="btn" type="submit">Submit Order</button>

</form>

<p style="font-size:12px;color:#7f95b8;">
Browse fonts at https://www.dafont.com
</p>

</div>

<!-- PREVIEW -->
<div class="card">

<div class="preview" id="previewText">
YOUR TEXT
</div>

<div class="summary" id="summary">
Live preview will update here
</div>

</div>

</div>

</div>

<script>
const textInput = document.getElementById("textInput");
const preview = document.getElementById("previewText");
const color = document.getElementById("color");
const fontInput = document.getElementById("fontInput");
const summary = document.getElementById("summary");

function updatePreview(){
  preview.innerText = textInput.value || "YOUR TEXT";
  preview.style.color = color.value;
  preview.style.fontFamily = fontInput.value || "Inter";

  summary.innerHTML =
    "Text: " + (textInput.value || "-") + "<br>" +
    "Color: " + color.value + "<br>" +
    "Font: " + (fontInput.value || "-");
}

textInput.addEventListener("input", updatePreview);
color.addEventListener("change", updatePreview);
fontInput.addEventListener("input", updatePreview);
</script>

</body>
</html>
