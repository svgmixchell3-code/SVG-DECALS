<div class="card">
  <h2>Order</h2>

  <form id="orderForm" action="https://formspree.io/f/YOUR_ID" method="POST" onsubmit="showThankYou()">

    <input type="hidden" name="order_id" id="order_id">

    <!-- NAME -->
    <input name="name" placeholder="Name" required
      style="width:100%;padding:10px;margin:6px 0;border:1px solid #f3c3a1;border-radius:10px;">

    <!-- ZELLE -->
    <input name="zelle_name" placeholder="Zelle Name" required
      style="width:100%;padding:10px;margin:6px 0;border:1px solid #f3c3a1;border-radius:10px;">

    <!-- SIZE (UPDATED COLUMN DROPDOWN) -->
    <label>Size</label>
    <select name="size"
      style="width:100%;padding:10px;margin:6px 0;border:1px solid #f3c3a1;border-radius:10px;">

      <option>5x2</option>
      <option>6x2</option>
      <option>7x2</option>
      <option selected>8x2</option>

    </select>

    <!-- PRIMARY COLOR (COLUMN 1) -->
    <label>Primary Color</label>
    <select name="primary_color"
      style="width:100%;padding:10px;margin:6px 0;border:1px solid #f3c3a1;border-radius:10px;">

      <option>Black</option>
      <option>White</option>
      <option>Red</option>
      <option>Blue</option>
      <option>Green</option>
      <option>Yellow</option>
      <option>Orange</option>
      <option>Purple</option>
      <option>Silver Chrome</option>
      <option>Black Chrome</option>
      <option>Reflective Silver</option>
      <option>Reflective Black</option>
      <option>Holographic</option>

    </select>

    <!-- LAYER TOGGLE -->
    <label>Layered Design (+$5)</label>
    <select id="layer" name="layer"
      style="width:100%;padding:10px;margin:6px 0;border:1px solid #f3c3a1;border-radius:10px;">

      <option value="0">No Layer</option>
      <option value="5">Yes (+$5 Secondary Color)</option>

    </select>

    <!-- SECONDARY COLOR (ONLY USED IF LAYERED) -->
    <label>Secondary Color (Top Layer)</label>
    <select name="secondary_color"
      style="width:100%;padding:10px;margin:6px 0;border:1px solid #f3c3a1;border-radius:10px;">

      <option>None</option>
      <option>Black</option>
      <option>White</option>
      <option>Red</option>
      <option>Blue</option>
      <option>Green</option>
      <option>Yellow</option>
      <option>Orange</option>
      <option>Purple</option>
      <option>Silver Chrome</option>
      <option>Black Chrome</option>
      <option>Reflective Silver</option>
      <option>Reflective Black</option>
      <option>Holographic</option>

    </select>

    <!-- NOTES -->
    <textarea name="notes" placeholder="Car / placement / details"
      style="width:100%;padding:10px;margin:6px 0;height:80px;border:1px solid #f3c3a1;border-radius:10px;"></textarea>

    <!-- PRICE -->
    <p>
      Order #: <span id="orderShow"></span><br>
      Total: $<span id="total">20</span>
    </p>

    <p style="font-size:12px;color:#7a5a4a;">
      Send Zelle to: SVG.mixchell3@gmail.com<br>
      Then DM proof + order #
    </p>

    <button class="btn" type="submit">Submit Order</button>

  </form>
</div>
