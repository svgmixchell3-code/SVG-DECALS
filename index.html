<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Custom Vinyl Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* =======================
   BASE
======================= */
body{
  margin:0;
  font-family:"Inter",sans-serif;
  color:#eef3f8;

  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 45%),
    radial-gradient(circle at 80% 40%, rgba(120,140,170,0.07), transparent 50%),
    linear-gradient(180deg, #07090d, #0b0f14);
}

/* =======================
   HEADER
======================= */
.hero{
  text-align:center;
  padding:70px 20px 10px;
}

.hero h1{
  font-size:48px;
  margin:0;
  letter-spacing:4px;
}

.hero p{
  color:#aab4c0;
  font-size:14px;
}

/* =======================
   LAYOUT
======================= */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
  display:flex;
  gap:20px;
}

/* =======================
   FORM CARD
======================= */
.card{
  flex:1;
  background:#111826;
  border:1px solid #1e2a3a;
  border-radius:14px;
  padding:18px;
}

/* =======================
   INPUTS
======================= */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #24344a;
  background:#0b0f14;
  color:white;
}

/* =======================
   BUTTON
======================= */
.btn{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #3aa0ff;
  background:#0b0f14;
  color:#3aa0ff;
  cursor:pointer;
}

.btn:hover{
  background:#3aa0ff;
  color:#0b0f14;
}

/* =======================
   PRICE
======================= */
.priceBox{
  background:#0b0f14;
  border:1px solid #24344a;
  padding:10px;
  border-radius:10px;
  font-size:14px;
  margin:10px 0;
}

/* =======================
   PREVIEW PANEL
======================= */
.preview{
  flex:1;
  height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:700;
  border-radius:14px;
  background:#0b0f14;
  border:1px solid #1e2a3a;
  position:sticky;
  top:20px;
}

/* =======================
   GALLERY
======================= */
.gallery{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.gallery img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #1e2a3a;
}

/* =======================
   INFO
======================= */
.info{
  font-size:13px;
  color:#aab4c0;
  margin-top:10px;
}

/* =======================
   MOBILE
======================= */
@media (max-width: 900px){
  .container{
    flex-direction:column;
  }
  .preview{
    position:relative;
    height:240px;
  }
}

</style>
</head>

<body>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Custom high-quality vinyl decals made to order</p>
</div>

<div class="container">

<!-- FORM -->
<div class="card">

<form id="orderForm" action="https://formspree.io/f/xzdydgap" method="POST">

<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<input name="zelle_name" placeholder="Name on Zelle Payment" required>

<!-- FONT -->
<label>Font Style</label>
<select id="fontSelect" name="font">

<option>Inter</option>
<option>Arial</option>
<option>Helvetica</option>
<option>Verdana</option>
<option>Tahoma</option>
<option>Impact</option>
<option>Arial Black</option>
<option>Franklin Gothic Medium</option>
<option>Bebas Neue</option>
<option>Courier New</option>
<option>Lucida Console</option>
<option>Georgia</option>
<option>Palatino</option>
<option>Brush Script MT</option>
<option>Futura</option>
<option>Gill Sans</option>
<option>Optima</option>
<option>Trebuchet MS</option>

</select>

<!-- SIZE -->
<label>Size</label>
<select id="size" name="size">
<option value="20">5 inch</option>
<option value="22">6 inch</option>
<option value="24">7 inch</option>
<option value="26">8 inch</option>
</select>

<!-- COLOR -->
<label>Color</label>
<select name="primary_color">
<option>White</option>
<option>Black</option>
<option>Red</option>
<option>Blue</option>
<option>Pink</option>
<option>Purple</option>
<option>Chrome</option>
</select>

<!-- LAYER -->
<label>Layer Option (+$5)</label>
<select id="layer" name="layer">
<option value="0">No</option>
<option value="5">Yes</option>
</select>

<!-- LAYER COLOR -->
<label>Layer Color</label>
<select name="layer_color">
<option>White</option>
<option>Black</option>
<option>Red</option>
<option>Blue</option>
<option>Pink</option>
<option>Purple</option>
<option>Chrome</option>
</select>

<textarea name="notes" placeholder="Notes / placement / custom requests"></textarea>

<input type="hidden" id="orderID" name="order_id">

<div class="priceBox" id="priceBox">Total: $20</div>

<button class="btn" type="submit">Submit Order</button>

</form>

<div class="info">
Zelle: <b>SVG DECALS</b><br>
Email: <b>SVG.mixchell3@gmail.com</b><br>
Orders are custom made after payment confirmation
</div>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">LIVE PREVIEW</div>

</div>

<!-- GALLERY -->
<div class="container">
<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>
</div>

<script>

/* ORDER ID */
const orderID = "SVG-" + Math.floor(1000 + Math.random() * 9000);
document.getElementById("orderID").value = orderID;

/* PREVIEW */
const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const preview = document.getElementById("preview");

function updatePreview(){
  preview.innerText = textInput.value || "LIVE PREVIEW";
  preview.style.fontFamily = fontSelect.value;
}

textInput.addEventListener("input", updatePreview);
fontSelect.addEventListener("change", updatePreview);

/* PRICE */
const size = document.getElementById("size");
const layer = document.getElementById("layer");
const priceBox = document.getElementById("priceBox");

function updatePrice(){
  let price = parseInt(size.value) + parseInt(layer.value);
  priceBox.innerText = "Total: $" + price;
}

size.addEventListener("change", updatePrice);
layer.addEventListener("change", updatePrice);

</script>

</body>
</html>
