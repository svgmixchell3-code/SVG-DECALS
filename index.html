<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Order Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:#0b0f16;
  color:#eaf2ff;
}

/* SIMPLE CLEAN HEADER */
.hero{
  text-align:center;
  padding:80px 20px 20px;
}

.hero h1{
  font-size:48px;
  letter-spacing:6px;
  margin:0;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

/* CLEAN CARD */
.card{
  background:#111826;
  border:1px solid #1f2a3a;
  border-radius:14px;
  padding:18px;
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #223044;
  background:#0b0f16;
  color:white;
}

/* BUTTON */
.btn{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #3aa0ff;
  background:#0b0f16;
  color:#3aa0ff;
  cursor:pointer;
}

.btn:hover{
  background:#3aa0ff;
  color:#0b0f16;
}

/* PRICE BOX */
.priceBox{
  background:#0b1220;
  border:1px solid #24344a;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  font-size:14px;
}

/* PREVIEW */
.preview{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:700;
  border-radius:12px;
  background:#0b0f16;
  border:1px solid #1f2a3a;
  margin-top:15px;
}

/* GALLERY */
.gallery{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.gallery img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #1f2a3a;
}

/* INFO */
.info{
  font-size:13px;
  color:#9fb3c8;
  margin-top:10px;
}

/* HIDDEN CONFIRM */
.confirm{
  display:none;
  text-align:center;
  padding:40px 20px;
}

</style>
</head>

<body>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Custom Vinyl Order Builder</p>
</div>

<div class="container">

<div class="card" id="formCard">

<form id="orderForm" action="https://formspree.io/f/xzdydgap" method="POST">

<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<input name="zelle_name" placeholder="Name on Zelle Payment" required>

<!-- FONT -->
<label>Font</label>
<select id="fontSelect" name="font">
<option>Inter</option>
<option>Arial</option>
<option>Impact</option>
<option>Courier New</option>
<option>Georgia</option>
<option>Tahoma</option>
<option>Verdana</option>
<option>Lucida Console</option>
<option>Futura</option>
</select>

<!-- SIZE -->
<label>Size (Pricing Based)</label>
<select id="size" name="size">
<option value="5">$10 - 5 inch</option>
<option value="6">$12 - 6 inch</option>
<option value="7">$14 - 7 inch</option>
<option value="8">$16 - 8 inch</option>
</select>

<!-- PRIMARY COLOR -->
<label>Primary Color</label>
<select name="primary_color">
<option>White</option>
<option>Black</option>
<option>Red</option>
<option>Blue</option>
<option>Pink</option>
<option>Purple</option>
<option>Chrome</option>
</select>

<!-- LAYER OPTION -->
<label>Layered Option (if applicable)</label>
<select id="layer" name="layer">
<option value="no">No</option>
<option value="yes">Yes (+$5)</option>
</select>

<!-- LAYER COLOR -->
<label>Layer Color (only applies if layered selected)</label>
<select name="layer_color">
<option>White</option>
<option>Black</option>
<option>Red</option>
<option>Blue</option>
<option>Pink</option>
<option>Purple</option>
<option>Chrome</option>
</select>

<textarea name="notes" placeholder="Notes / placement / custom requests"></textarea>

<input type="hidden" id="orderID" name="order_id">

<!-- PRICE DISPLAY -->
<div class="priceBox" id="priceBox">
Estimated Price: $10+
</div>

<button class="btn" type="submit">Submit Order</button>

</form>

<div class="info">
Zelle: <b>SVG DECALS</b><br>
Email: <b>SVG.mixchell3@gmail.com</b>
</div>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">LIVE PREVIEW</div>

<!-- IMAGES -->
<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>

</div>

<script>

const form = document.getElementById("orderForm");

const orderID = "SVG-" + Math.floor(1000 + Math.random() * 9000);
document.getElementById("orderID").value = orderID;

/* PREVIEW */
const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const preview = document.getElementById("preview");

function updatePreview(){
  preview.innerText = textInput.value || "LIVE PREVIEW";
  preview.style.fontFamily = fontSelect.value;
}

textInput.addEventListener("input", updatePreview);
fontSelect.addEventListener("change", updatePreview);

/* PRICING SYSTEM */
const sizeSelect = document.getElementById("size");
const layerSelect = document.getElementById("layer");
const priceBox = document.getElementById("priceBox");

function updatePrice(){
  let price = 10;

  if(sizeSelect.value === "6") price = 12;
  if(sizeSelect.value === "7") price = 14;
  if(sizeSelect.value === "8") price = 16;

  if(layerSelect.value === "yes") price += 5;

  priceBox.innerText = "Estimated Price: $" + price;
}

sizeSelect.addEventListener("change", updatePrice);
layerSelect.addEventListener("change", updatePrice);

</script>

</body>
</html>
