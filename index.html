<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Neon Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Inter",sans-serif;
  color:#EAF2FF;
  background:
    radial-gradient(circle at 20% 20%, rgba(77,163,255,0.18), transparent 45%),
    radial-gradient(circle at 80% 30%, rgba(168,85,247,0.15), transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(255,59,92,0.10), transparent 55%),
    #070A12;
  overflow-x:hidden;
}

/* NEON GRID BACKGROUND */
body::before{
  content:"";
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background-image:
    linear-gradient(rgba(77,163,255,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,163,255,0.08) 1px, transparent 1px);
  background-size:60px 60px;
  opacity:0.25;
  pointer-events:none;
}

/* TOP BAR */
.topbar{
  height:4px;
  background:linear-gradient(90deg,#4DA3FF,#A855F7,#FF3B5C);
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
}

/* HERO */
.hero{
  text-align:center;
  padding:120px 20px 40px;
}

.hero h1{
  font-size:64px;
  letter-spacing:10px;
  color:#4DA3FF;
  text-shadow:0 0 30px rgba(77,163,255,0.45);
}

.hero p{
  color:#93a7c6;
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

/* BUILDER CARD */
.card{
  max-width:650px;
  margin:auto;
  background:rgba(12,18,34,0.85);
  border:1px solid rgba(77,163,255,0.25);
  border-radius:20px;
  padding:25px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #223456;
  background:#070A12;
  color:#fff;
}

/* PREVIEW */
.preview{
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-size:46px;
  font-weight:700;
  letter-spacing:2px;

  background:
    radial-gradient(circle at top, rgba(77,163,255,0.15), transparent 60%),
    linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.25));

  border:1px solid rgba(77,163,255,0.25);
  box-shadow:inset 0 0 40px rgba(0,0,0,0.6);
}

/* BUTTON */
.btn{
  padding:12px;
  border:1px solid #4DA3FF;
  color:#4DA3FF;
  background:none;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover{
  background:#4DA3FF;
  color:#070A12;
  box-shadow:0 0 25px rgba(77,163,255,0.5);
}

/* SMALL */
.small{
  font-size:12px;
  color:#7fa6c9;
}
</style>
</head>

<body>

<div class="topbar"></div>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Neon Garage Builder • Custom Vinyl Made Simple</p>
</div>

<div class="container">

<div class="card">

<form action="https://formspree.io/f/xzdydgap" method="POST">

<!-- TEXT -->
<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<!-- FONT LIBRARY (EXPANDED) -->
<label>Font Style</label>
<select id="fontSelect" name="font">

<option value="Inter">Default Clean</option>
<option value="Arial Black">Street Bold</option>
<option value="Impact">Racing Block</option>
<option value="cursive">Script Flow</option>
<option value="monospace">JDM Tech</option>
<option value="Tahoma">OEM Clean</option>
<option value="Verdana">Modern Clean</option>
<option value="Georgia">Classic Serif</option>
<option value="Courier New">Typewriter</option>
<option value="Trebuchet MS">Sport Style</option>
<option value="Lucida Console">Garage Tech</option>
<option value="Palatino">Luxury Script</option>
<option value="Gill Sans">Clean Euro</option>
<option value="Franklin Gothic Medium">Aggressive Bold</option>

</select>

<!-- COLORS -->
<label>Primary Color</label>
<select id="color">
<option value="white">White</option>
<option value="red">Red</option>
<option value="orange">Orange</option>
<option value="yellow">Yellow</option>
<option value="green">Green</option>
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="pink">Pink</option>
<option value="silver">Chrome</option>
</select>

<label>Layer (+$5)</label>
<select name="layer">
<option>No</option>
<option>Yes</option>
</select>

<textarea name="notes" placeholder="Notes (placement, size, custom requests)"></textarea>

<button class="btn" type="submit">Submit Order</button>

</form>

<p class="small">Neon Garage System • SVG DECALS</p>

</div>

<!-- PREVIEW -->
<div class="card" style="margin-top:25px;">

<div class="preview" id="preview">YOUR DESIGN</div>

</div>

</div>

<script>

const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const color = document.getElementById("color");
const preview = document.getElementById("preview");

function update(){
  preview.innerText = textInput.value || "YOUR DESIGN";
  preview.style.color = color.value;
  preview.style.fontFamily = fontSelect.value;
}

textInput.addEventListener("input", update);
fontSelect.addEventListener("change", update);
color.addEventListener("change", update);

</script>

</body>
</html>
