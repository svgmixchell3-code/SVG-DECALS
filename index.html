<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Premium Vinyl</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
html{scroll-behavior:smooth;}

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:#070a10;
  color:#eef3fb;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:28px;
  padding:14px;
  background:rgba(10,12,18,0.8);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #1c2333;
  z-index:999;
}

nav a{
  font-size:13px;
  text-decoration:none;
  color:#cfd8e4;
}

nav a:hover{color:#5aa7ff;}

/* HERO */
.hero{
  text-align:center;
  padding:150px 20px 100px;
  background:radial-gradient(circle at top,#121a2d,#070a10);
}

.hero h1{
  font-size:70px;
  letter-spacing:10px;
  margin:0;
}

.hero p{
  color:#aab6c7;
  margin-top:10px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 24px;
  border-radius:12px;
  border:1px solid #5aa7ff;
  color:#5aa7ff;
  text-decoration:none;
  transition:0.2s;
}

.btn:hover{
  background:#5aa7ff;
  color:#070a10;
}

/* SECTIONS */
.section{
  max-width:1100px;
  margin:auto;
  padding:80px 20px;
}

.title{
  font-size:32px;
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#0d1320;
  border:1px solid #1c2333;
  border-radius:18px;
  padding:20px;
}

/* FORM */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #26324a;
  background:#070a10;
  color:#eef3fb;
}

/* SIZE */
.size-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:10px 0;
}

.size-option{
  padding:11px;
  text-align:center;
  border-radius:10px;
  border:1px solid #26324a;
  cursor:pointer;
  font-size:13px;
}

.size-option.active{
  border-color:#5aa7ff;
  color:#5aa7ff;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}

.gallery img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #1c2333;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<a href="#shop">SHOP</a>
<a href="#build">BUILD</a>
<a href="#gallery">GALLERY</a>
</nav>

<!-- HERO -->
<div class="hero">
<h1>SVG DECALS</h1>
<p>Premium automotive vinyl • Weatherproof • Clean installs</p>
<a class="btn" href="https://instagram.com/svg.mixchell3" target="_blank">Instagram</a>
</div>

<!-- BUILD -->
<div id="build" class="section">
<div class="title">BUILD YOUR DECAL</div>

<div class="grid">

<div class="card">

<form action="https://formspree.io/f/xzdydgap" method="POST">

<!-- INSTAGRAM -->
<input name="instagram_name" placeholder="Instagram Name (@yourname)" required>

<!-- ZELLE -->
<input name="zelle_name" placeholder="Zelle Name" required>

<!-- SIZE -->
<div class="size-grid">
<div class="size-option active">5x2</div>
<div class="size-option">6x2</div>
<div class="size-option">7x2</div>
<div class="size-option">8x2</div>
</div>

<!-- COLORS -->
<label>Primary Color</label>
<select name="primary_color">
<option>Black</option>
<option>White</option>
<option>Red</option>
<option>Blue</option>
<option>Chrome</option>
<option>Holographic</option>
</select>

<label>Layer (+$5)</label>
<select name="layer" id="layer">
<option value="0">No</option>
<option value="5">Yes</option>
</select>

<label>Secondary Color</label>
<select name="secondary_color">
<option>None</option>
<option>Black</option>
<option>White</option>
<option>Chrome</option>
<option>Holographic</option>
</select>

<!-- NOTES -->
<textarea name="notes" placeholder="Any notes (placement, sizing, custom requests)" rows="4"></textarea>

<button class="btn" type="submit">Submit Order</button>

</form>

<p>Send payment via Zelle: SVG.mixchell3@gmail.com</p>

</div>

</div>
</div>

<!-- GALLERY -->
<div id="gallery" class="section">
<div class="title">GALLERY</div>

<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>

</div>

<script>
// SIZE SELECT
document.querySelectorAll(".size-option").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".size-option").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
};
});

// PRICE LOGIC (optional future upgrade ready)
const layer=document.getElementById("layer");
</script>

</body>
</html>
