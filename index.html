<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Neon Garage Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
/* =========================
   BASE / BRAND
========================= */
body{
  margin:0;
  font-family:"Inter",sans-serif;
  color:#EAF2FF;
  background:
    radial-gradient(circle at 20% 20%, rgba(77,163,255,0.18), transparent 45%),
    radial-gradient(circle at 80% 30%, rgba(168,85,247,0.15), transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(255,59,92,0.10), transparent 55%),
    #070A12;
  overflow-x:hidden;
  animation:fadeIn 0.8s ease;
}

/* neon grid overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(77,163,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,163,255,0.07) 1px, transparent 1px);
  background-size:60px 60px;
  opacity:0.25;
  pointer-events:none;
}

/* moving glow */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(77,163,255,0.08), transparent 50%),
    radial-gradient(circle at 70% 60%, rgba(168,85,247,0.06), transparent 55%);
  animation:glowMove 8s ease-in-out infinite alternate;
  pointer-events:none;
}

/* =========================
   TOP BAR
========================= */
.topbar{
  height:4px;
  background:linear-gradient(90deg,#4DA3FF,#A855F7,#FF3B5C);
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
}

/* =========================
   HERO
========================= */
.hero{
  text-align:center;
  padding:110px 20px 20px;
}

.hero h1{
  font-size:60px;
  letter-spacing:8px;
  color:#4DA3FF;
  text-shadow:0 0 30px rgba(77,163,255,0.45);
}

.hero p{
  color:#93a7c6;
}

/* =========================
   LAYOUT
========================= */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* =========================
   CARD
========================= */
.card{
  background:rgba(12,18,34,0.85);
  border:1px solid rgba(77,163,255,0.2);
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  animation:cardIn 0.8s ease;
}

/* =========================
   INPUTS
========================= */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #223456;
  background:#070A12;
  color:#fff;
}

/* =========================
   BUTTON
========================= */
.btn{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #4DA3FF;
  background:none;
  color:#4DA3FF;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover{
  background:#4DA3FF;
  color:#070A12;
  box-shadow:0 0 25px rgba(77,163,255,0.5);
}

/* =========================
   PREVIEW
========================= */
.preview{
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-size:44px;
  font-weight:700;
  letter-spacing:2px;
  background:
    radial-gradient(circle at top, rgba(77,163,255,0.15), transparent 60%),
    linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.25));
  border:1px solid rgba(77,163,255,0.25);
  box-shadow:inset 0 0 40px rgba(0,0,0,0.6);
}

/* =========================
   INFO TEXT
========================= */
.info{
  font-size:13px;
  color:#9ab0d1;
  margin-top:10px;
  line-height:1.5;
}

/* =========================
   GALLERY
========================= */
.gallery{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid rgba(77,163,255,0.2);
  transition:0.3s;
}

.gallery img:hover{
  transform:scale(1.03);
  box-shadow:0 10px 30px rgba(77,163,255,0.2);
}

/* =========================
   CONFIRM SCREEN
========================= */
.confirm{
  display:none;
  text-align:center;
  padding:40px 20px;
  animation:popIn 0.6s ease;
}

.confirm h2{
  color:#4DA3FF;
}

/* =========================
   ANIMATIONS
========================= */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes cardIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes glowMove{
  from{transform:translate(0,0);}
  to{transform:translate(10px,-10px);}
}

@keyframes popIn{
  from{opacity:0; transform:scale(0.95);}
  to{opacity:1; transform:scale(1);}
}
</style>
</head>

<body>

<div class="topbar"></div>

<div class="hero">
<h1>SVG DECALS</h1>
<p>Neon Garage Custom Vinyl Store</p>
</div>

<div class="container">

<!-- FORM -->
<div class="card" id="formCard">

<form id="orderForm" action="https://formspree.io/f/xzdydgap" method="POST">

<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<input name="zelle_name" placeholder="Name on Zelle Payment" required>

<label>Font Style</label>
<select id="fontSelect" name="font">

<option value="Inter">Default Clean</option>
<option value="Impact">Racing Block</option>
<option value="Arial Black">Street Bold</option>
<option value="cursive">Script Flow</option>
<option value="monospace">JDM Tech</option>
<option value="Tahoma">OEM Clean</option>
<option value="Verdana">Modern Clean</option>
<option value="Georgia">Classic Serif</option>
<option value="Courier New">Typewriter</option>
<option value="Trebuchet MS">Sport Style</option>
<option value="Franklin Gothic Medium">Aggressive Bold</option>
<option value="Lucida Console">Garage Tech</option>
<option value="Palatino">Luxury Script</option>

</select>

<label>Primary Color</label>
<select id="color" name="color">
<option value="white">White</option>
<option value="red">Red</option>
<option value="orange">Orange</option>
<option value="yellow">Yellow</option>
<option value="green">Green</option>
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="pink">Pink</option>
<option value="silver">Chrome</option>
</select>

<label>Size</label>
<select name="size">
<option>5 inch</option>
<option>6 inch</option>
<option>7 inch</option>
<option>8 inch</option>
</select>

<label>Layer (+$5)</label>
<select name="layer">
<option>No</option>
<option>Yes</option>
</select>

<textarea name="notes" placeholder="Notes (placement, custom requests)"></textarea>

<input type="hidden" id="orderID" name="order_id">

<button class="btn" type="submit">Submit Order</button>

</form>

<div class="info">
<strong>Zelle Payment Info:</strong><br>
Send to: <b>SVG DECALS</b><br>
Email: <b>SVG.mixchell3@gmail.com</b><br><br>
After submitting, DM your Instagram with your Order ID.
</div>

</div>

<!-- CONFIRM -->
<div class="confirm" id="confirmScreen">
<h2>Order Received ✅</h2>
<p id="orderText"></p>
<p class="info">Send payment via Zelle and DM your Order ID.</p>
</div>

<!-- GALLERY -->
<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>

</div>

<script>

const form = document.getElementById("orderForm");
const confirmScreen = document.getElementById("confirmScreen");
const formCard = document.getElementById("formCard");

const orderID = "SVG-" + Math.floor(1000 + Math.random() * 9000);
document.getElementById("orderID").value = orderID;

const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const color = document.getElementById("color");
const preview = document.createElement("div");

formCard.appendChild(preview);
preview.className = "preview";
preview.innerText = "LIVE PREVIEW";

function update(){
  preview.innerText = textInput.value || "LIVE PREVIEW";
  preview.style.color = color.value;
  preview.style.fontFamily = fontSelect.value;
}

textInput.addEventListener("input", update);
fontSelect.addEventListener("change", update);
color.addEventListener("change", update);

form.addEventListener("submit", function(e){
  document.getElementById("orderText").innerHTML =
    "Your Order ID: <b>" + orderID + "</b>";

  formCard.style.display = "none";
  confirmScreen.style.display = "block";
});

</script>

</body>
</html>
