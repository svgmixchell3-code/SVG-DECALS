<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG DECALS | Luxury Vinyl Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:"Inter",sans-serif;
  color:#eef3f8;

  /* LUXURY DARK */
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(120,130,150,0.08), transparent 45%),
    linear-gradient(180deg, #07090d, #0b0f14);
}

/* CLEAN GRID */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:80px 80px;
  opacity:0.12;
  pointer-events:none;
}

/* HEADER */
.hero{
  text-align:center;
  padding:80px 20px 10px;
}

.hero h1{
  font-size:46px;
  letter-spacing:4px;
  margin:0;
  color:#f5f7fa;
}

.hero p{
  color:#aab4c0;
  font-size:14px;
}

/* LAYOUT */
.container{
  max-width:880px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:rgba(18,22,28,0.85);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(12px);
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
  background:#0b0f14;
  color:#fff;
}

/* BUTTON */
.btn{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
  background:#0b0f14;
  color:#e8edf2;
  cursor:pointer;
}

.btn:hover{
  background:#1a222c;
}

/* PRICE */
.priceBox{
  background:#0b0f14;
  border:1px solid rgba(255,255,255,0.08);
  padding:10px;
  border-radius:10px;
  font-size:14px;
  margin:10px 0;
}

/* PREVIEW */
.preview{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:700;
  border-radius:12px;
  background:#0b0f14;
  border:1px solid rgba(255,255,255,0.08);
  margin-top:15px;
}

/* GALLERY */
.gallery{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.gallery img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
}

/* INFO */
.info{
  font-size:13px;
  color:#aab4c0;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="hero">
<h1>SVG DECALS</h1>
<p>High-quality custom vinyl decals made to order</p>
</div>

<div class="container">

<div class="card">

<form id="orderForm" action="https://formspree.io/f/xzdydgap" method="POST">

<input id="textInput" name="text" placeholder="Instagram / Decal Text" required>

<input name="zelle_name" placeholder="Name on Zelle Payment" required>

<!-- FONT -->
<label>Font Style</label>
<select id="fontSelect" name="font">
<option>Inter</option>
<option>Arial</option>
<option>Impact</option>
<option>Verdana</option>
<option>Courier New</option>
<option>Georgia</option>
<option>Futura</option>
<option>Tahoma</option>
<option>Lucida Console</option>
</select>

<!-- SIZE (2 TAGS $20) -->
<label>Size (2 tags = $20 total base price)</label>
<select id="size" name="size">
<option value="10">5 inch</option>
<option value="10">6 inch</option>
<option value="10">7 inch</option>
<option value="10">8 inch</option>
</select>

<!-- COLOR -->
<label>Color</label>
<select name="primary_color">
<option>White</option>
<option>Black</option>
<option>Red</option>
<option>Blue</option>
<option>Pink</option>
<option>Purple</option>
<option>Chrome</option>
</select>

<!-- LAYER -->
<label>Layer Option (+$5 if selected)</label>
<select id="layer" name="layer">
<option value="0">No</option>
<option value="5">Yes</option>
</select>

<!-- LAYER COLOR -->
<label>Layer Color (if layered)</label>
<select name="layer_color">
<option>White</option>
<option>Black</option>
<option>Red</option>
<option>Blue</option>
<option>Pink</option>
<option>Purple</option>
<option>Chrome</option>
</select>

<textarea name="notes" placeholder="Notes / placement / custom requests"></textarea>

<input type="hidden" id="orderID" name="order_id">

<div class="priceBox" id="priceBox">Estimated Price: $10</div>

<button class="btn" type="submit">Submit Order</button>

</form>

<div class="info">
Zelle: <b>SVG DECALS</b><br>
Email: <b>SVG.mixchell3@gmail.com</b><br>
2 tags = $20 base pricing
</div>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">LIVE PREVIEW</div>

<!-- IMAGES -->
<div class="gallery">
<img src="IMG1.png">
<img src="IMG2.png">
<img src="IMG3.png">
<img src="IMG4.png">
</div>

</div>

<script>

const orderID = "SVG-" + Math.floor(1000 + Math.random() * 9000);
document.getElementById("orderID").value = orderID;

/* preview */
const textInput = document.getElementById("textInput");
const fontSelect = document.getElementById("fontSelect");
const preview = document.getElementById("preview");

function updatePreview(){
  preview.innerText = textInput.value || "LIVE PREVIEW";
  preview.style.fontFamily = fontSelect.value;
}

textInput.addEventListener("input", updatePreview);
fontSelect.addEventListener("change", updatePreview);

/* pricing */
const layer = document.getElementById("layer");
const priceBox = document.getElementById("priceBox");

function updatePrice(){
  let price = 20; // 2 tags base price
  price += parseInt(layer.value);
  priceBox.innerText = "Estimated Price: $" + price;
}

layer.addEventListener("change", updatePrice);

</script>

</body>
</html>
